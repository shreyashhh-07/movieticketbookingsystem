spring.application.name=movieticketbooking

# ---- MySQL (override with environment variables if needed) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movieticketdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:movie-ticket-booking-demo-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Default admin account created on first start ----
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:admin@movie.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
